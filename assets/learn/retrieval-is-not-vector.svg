<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="t d"><title id="t">What Scout retrieval is and is not</title><desc id="d">Comparison of Scout's current lexical BM25 and contextual RRF path with a different embedding and vector database architecture.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03080d"/><stop offset="1" stop-color="#06141e"/></linearGradient></defs><rect width="1200" height="790" rx="18" fill="url(#bg)"/><g stroke="#173044" opacity=".3"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200"/><path d="M120 0V790M240 0V790M360 0V790M480 0V790M600 0V790M720 0V790M840 0V790M960 0V790M1080 0V790"/></g><text x="48" y="62" fill="#69ff84" font-size="18" font-family="monospace" font-weight="700">SCOUT LEARN · RETRIEVAL ARCHITECTURE</text><text x="48" y="118" fill="#f4f8fa" font-size="43" font-family="Arial,sans-serif" font-weight="800">What Scout retrieval is, and what it is not</text><text x="48" y="151" fill="#91a8b5" font-size="19" font-family="Arial,sans-serif">RAG describes retrieval + generation. It does not require one particular retrieval algorithm.</text>
<rect x="48" y="188" width="530" height="500" rx="12" fill="#07121b" stroke="#2d6d48"/><text x="72" y="226" fill="#69ff84" font-size="22" font-family="Arial,sans-serif" font-weight="800">CURRENT SCOUT PATH</text><text x="72" y="254" fill="#a6b8c2" font-size="16" font-family="Arial,sans-serif">Lexical retrieval over local structured knowledge.</text>
<g font-family="Arial,sans-serif"><rect x="80" y="286" width="466" height="54" rx="7" fill="#0a1820" stroke="#315e43"/><text x="100" y="319" fill="#e3edf1" font-size="18">1 · Structured knowledge</text><rect x="80" y="352" width="466" height="54" rx="7" fill="#0a1820" stroke="#315e43"/><text x="100" y="385" fill="#e3edf1" font-size="18">2 · Text chunks + metadata</text><rect x="80" y="418" width="466" height="54" rx="7" fill="#0a1820" stroke="#315e43"/><text x="100" y="451" fill="#e3edf1" font-size="18">3 · Word-like tokenization</text><rect x="80" y="484" width="466" height="54" rx="7" fill="#0a1820" stroke="#315e43"/><text x="100" y="517" fill="#69ff84" font-size="18" font-weight="700">4 · BM25 lexical ranking</text><rect x="80" y="550" width="466" height="54" rx="7" fill="#0a1820" stroke="#315e43"/><text x="100" y="583" fill="#69ff84" font-size="18" font-weight="700">5 · Contextual query views + RRF</text><rect x="80" y="616" width="466" height="54" rx="7" fill="#0a1820" stroke="#315e43"/><text x="100" y="649" fill="#e3edf1" font-size="18">6 · Selected evidence pack → model</text></g>
<rect x="622" y="188" width="530" height="500" rx="12" fill="#07121b" stroke="#2876a4"/><text x="646" y="226" fill="#59c9ff" font-size="22" font-family="Arial,sans-serif" font-weight="800">A DIFFERENT ARCHITECTURE</text><text x="646" y="254" fill="#a6b8c2" font-size="16" font-family="Arial,sans-serif">Embedding-driven semantic retrieval, not Scout's active path today.</text>
<g font-family="Arial,sans-serif"><rect x="654" y="286" width="466" height="54" rx="7" fill="#0a1820" stroke="#2d5871"/><text x="674" y="319" fill="#e3edf1" font-size="18">1 · Documents / chunks</text><rect x="654" y="352" width="466" height="54" rx="7" fill="#0a1820" stroke="#2d5871"/><text x="674" y="385" fill="#59c9ff" font-size="18" font-weight="700">2 · Embedding model → dense vectors</text><rect x="654" y="418" width="466" height="54" rx="7" fill="#0a1820" stroke="#2d5871"/><text x="674" y="451" fill="#59c9ff" font-size="18" font-weight="700">3 · Vector database / ANN index</text><rect x="654" y="484" width="466" height="54" rx="7" fill="#0a1820" stroke="#2d5871"/><text x="674" y="517" fill="#e3edf1" font-size="18">4 · Query embedding</text><rect x="654" y="550" width="466" height="54" rx="7" fill="#0a1820" stroke="#2d5871"/><text x="674" y="583" fill="#e3edf1" font-size="18">5 · Nearest-neighbor similarity</text><rect x="654" y="616" width="466" height="54" rx="7" fill="#0a1820" stroke="#2d5871"/><text x="674" y="649" fill="#e3edf1" font-size="18">6 · Semantically similar chunks → model</text></g>
<rect x="48" y="714" width="1104" height="48" rx="8" fill="#08151d" stroke="#24573a"/><text x="72" y="745" fill="#dce8ed" font-size="18" font-family="Arial,sans-serif"><tspan fill="#69ff84" font-weight="700">Scout today:</tspan> BM25 + contextual RRF.  <tspan fill="#59c9ff" font-weight="700">Not required for RAG:</tspan> embeddings or a vector database.</text></svg>