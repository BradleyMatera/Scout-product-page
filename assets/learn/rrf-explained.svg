<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Reciprocal Rank Fusion explained</title><desc id="d">Three ranked result lists fused using reciprocal rank instead of raw scores.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#03080d"/><stop offset="1" stop-color="#06141e"/></linearGradient></defs><rect width="1200" height="760" rx="18" fill="url(#b)"/><g stroke="#173044" opacity=".32"><path d="M0 95H1200M0 190H1200M0 285H1200M0 380H1200M0 475H1200M0 570H1200M0 665H1200"/><path d="M120 0V760M240 0V760M360 0V760M480 0V760M600 0V760M720 0V760M840 0V760M960 0V760M1080 0V760"/></g><text x="48" y="64" fill="#69ff84" font-size="18" font-family="monospace" font-weight="700">SCOUT LEARN · RANK FUSION</text><text x="48" y="122" fill="#f3f8fa" font-size="46" font-family="Arial,sans-serif" font-weight="800">RRF: Reciprocal Rank Fusion</text><text x="48" y="155" fill="#8ea6b3" font-size="20" font-family="Arial,sans-serif">Combine several rankings without pretending their raw score scales are comparable.</text>
<g font-family="Arial,sans-serif"><rect x="48" y="198" width="230" height="260" rx="10" fill="#07121b" stroke="#2c6d48"/><text x="70" y="230" fill="#69ff84" font-size="18" font-weight="700">Ranking A</text><text x="70" y="270" fill="#dce8ed" font-size="17">1 · chunk_42</text><text x="70" y="306" fill="#dce8ed" font-size="17">2 · chunk_19</text><text x="70" y="342" fill="#dce8ed" font-size="17">3 · chunk_07</text><text x="70" y="378" fill="#dce8ed" font-size="17">4 · chunk_81</text><text x="70" y="414" fill="#708a98" font-size="17">…</text>
<rect x="302" y="198" width="230" height="260" rx="10" fill="#07121b" stroke="#2878a6"/><text x="324" y="230" fill="#59c9ff" font-size="18" font-weight="700">Ranking B</text><text x="324" y="270" fill="#dce8ed" font-size="17">1 · chunk_19</text><text x="324" y="306" fill="#dce8ed" font-size="17">2 · chunk_42</text><text x="324" y="342" fill="#dce8ed" font-size="17">3 · chunk_65</text><text x="324" y="378" fill="#dce8ed" font-size="17">4 · chunk_07</text><text x="324" y="414" fill="#708a98" font-size="17">…</text>
<rect x="556" y="198" width="230" height="260" rx="10" fill="#07121b" stroke="#2e8379"/><text x="578" y="230" fill="#66e8cf" font-size="18" font-weight="700">Ranking C</text><text x="578" y="270" fill="#dce8ed" font-size="17">1 · chunk_42</text><text x="578" y="306" fill="#dce8ed" font-size="17">2 · chunk_07</text><text x="578" y="342" fill="#dce8ed" font-size="17">3 · chunk_19</text><text x="578" y="378" fill="#dce8ed" font-size="17">4 · chunk_65</text><text x="578" y="414" fill="#708a98" font-size="17">…</text></g>
<path d="M278 330H292M532 330H546M786 330H824" stroke="#69ff84" stroke-width="4"/><path d="M816 323l13 7-13 7" fill="none" stroke="#69ff84" stroke-width="4"/>
<rect x="838" y="198" width="314" height="260" rx="10" fill="#07121b" stroke="#2c6d48"/><text x="860" y="230" fill="#69ff84" font-size="18" font-family="Arial,sans-serif" font-weight="700">Fused order</text><text x="860" y="270" fill="#dce8ed" font-size="17" font-family="Arial,sans-serif">1 · chunk_42</text><text x="860" y="306" fill="#dce8ed" font-size="17" font-family="Arial,sans-serif">2 · chunk_19</text><text x="860" y="342" fill="#dce8ed" font-size="17" font-family="Arial,sans-serif">3 · chunk_07</text><text x="860" y="378" fill="#dce8ed" font-size="17" font-family="Arial,sans-serif">4 · chunk_65</text><text x="860" y="420" fill="#86a0ad" font-size="14" font-family="Arial,sans-serif">Good rank in several lists accumulates.</text>
<rect x="48" y="490" width="705" height="158" rx="10" fill="#07121b" stroke="#286887"/><text x="70" y="524" fill="#59c9ff" font-size="17" font-family="monospace" font-weight="700">FORMULA · Scout uses k = 60</text><text x="84" y="576" fill="#edf4f7" font-size="30" font-family="Georgia,serif">RRF(d) = Σ 1 / (60 + rankᵢ(d))</text><text x="84" y="615" fill="#8fa5b1" font-size="16" font-family="Arial,sans-serif">A rank-1 appearance contributes 1/61 ≈ 0.01639. Rank 10 contributes 1/70 ≈ 0.01429.</text>
<rect x="777" y="490" width="375" height="158" rx="10" fill="#07121b" stroke="#2c6d48"/><text x="799" y="524" fill="#69ff84" font-size="17" font-family="monospace" font-weight="700">WHY RANKS?</text><text x="799" y="558" fill="#dbe7ec" font-size="17" font-family="Arial,sans-serif">Separate BM25 searches can have</text><text x="799" y="584" fill="#dbe7ec" font-size="17" font-family="Arial,sans-serif">different raw score ranges. RRF uses</text><text x="799" y="610" fill="#dbe7ec" font-size="17" font-family="Arial,sans-serif">positions instead of calibrating scores.</text>
<rect x="48" y="674" width="1104" height="48" rx="8" fill="#08151d" stroke="#24573a"/><text x="72" y="705" fill="#dce8ed" font-size="18" font-family="Arial,sans-serif"><tspan fill="#69ff84" font-weight="700">Takeaway:</tspan> several consistently good rankings can beat one isolated first-place result.</text></svg>