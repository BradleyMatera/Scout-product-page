<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">How retrieval is evaluated</title><desc id="d">Recall at six measures whether relevant evidence is found; MRR at six measures how early the first relevant result appears.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03080d"/><stop offset="1" stop-color="#06141e"/></linearGradient></defs><rect width="1200" height="760" rx="18" fill="url(#bg)"/><g stroke="#173044" opacity=".3"><path d="M0 95H1200M0 190H1200M0 285H1200M0 380H1200M0 475H1200M0 570H1200M0 665H1200"/><path d="M120 0V760M240 0V760M360 0V760M480 0V760M600 0V760M720 0V760M840 0V760M960 0V760M1080 0V760"/></g><text x="48" y="64" fill="#69ff84" font-size="18" font-family="monospace" font-weight="700">SCOUT LEARN · EVALUATION</text><text x="48" y="120" fill="#f4f8fa" font-size="46" font-family="Arial,sans-serif" font-weight="800">How retrieval is evaluated</text><text x="48" y="154" fill="#91a8b5" font-size="20" font-family="Arial,sans-serif">Two different questions: did we find relevant evidence, and how early did we find it?</text>
<rect x="48" y="194" width="530" height="235" rx="11" fill="#07121b" stroke="#2d6d48"/><text x="72" y="232" fill="#69ff84" font-size="26" font-family="Arial,sans-serif" font-weight="800">Recall@6</text><text x="72" y="266" fill="#dce8ed" font-size="18" font-family="Arial,sans-serif">Did a relevant result appear anywhere in the top 6?</text><text x="80" y="324" fill="#edf4f7" font-size="24" font-family="Georgia,serif">hit(q) = 1 if relevant result ∈ top 6; else 0</text><text x="80" y="368" fill="#edf4f7" font-size="24" font-family="Georgia,serif">Recall@6 = Σ hit(q) / number of queries</text><text x="72" y="407" fill="#91a8b5" font-size="15" font-family="Arial,sans-serif">Scout's golden-set gate asks whether expected evidence was surfaced within six results.</text>
<rect x="602" y="194" width="550" height="235" rx="11" fill="#07121b" stroke="#2876a4"/><text x="626" y="232" fill="#59c9ff" font-size="26" font-family="Arial,sans-serif" font-weight="800">MRR@6</text><text x="626" y="266" fill="#dce8ed" font-size="18" font-family="Arial,sans-serif">At what rank did the first relevant result appear?</text><text x="634" y="324" fill="#edf4f7" font-size="24" font-family="Georgia,serif">RR(q) = 1 / first_relevant_rank</text><text x="634" y="360" fill="#9bb0bc" font-size="16" font-family="Arial,sans-serif">or 0 if the first relevant result is outside the cutoff</text><text x="634" y="396" fill="#edf4f7" font-size="24" font-family="Georgia,serif">MRR@6 = Σ RR(q) / number of queries</text>
<rect x="48" y="458" width="1104" height="182" rx="11" fill="#07121b" stroke="#24506a"/><text x="72" y="494" fill="#69ff84" font-size="17" font-family="monospace" font-weight="700">MINI EXAMPLE · k = 6</text><g font-family="Arial,sans-serif" font-size="17"><text x="82" y="536" fill="#9bb0bc">Query</text><text x="230" y="536" fill="#9bb0bc">First relevant rank</text><text x="470" y="536" fill="#9bb0bc">Recall@6</text><text x="650" y="536" fill="#9bb0bc">Reciprocal rank</text><text x="82" y="572" fill="#e2ebef">Q1</text><text x="230" y="572" fill="#e2ebef">2</text><text x="470" y="572" fill="#69ff84">1</text><text x="650" y="572" fill="#59c9ff">1/2 = 0.50</text><text x="82" y="606" fill="#e2ebef">Q2</text><text x="230" y="606" fill="#e2ebef">5</text><text x="470" y="606" fill="#69ff84">1</text><text x="650" y="606" fill="#59c9ff">1/5 = 0.20</text><text x="850" y="572" fill="#dce8ed">Recall = 2/2 = 1.00</text><text x="850" y="606" fill="#dce8ed">MRR = (0.50 + 0.20)/2 = 0.35</text></g>
<rect x="48" y="666" width="1104" height="52" rx="8" fill="#08151d" stroke="#24573a"/><text x="72" y="699" fill="#dce8ed" font-size="18" font-family="Arial,sans-serif"><tspan fill="#69ff84" font-weight="700">Recall asks:</tspan> did we find it?   <tspan fill="#59c9ff" font-weight="700">MRR asks:</tspan> how early did we find it?</text></svg>