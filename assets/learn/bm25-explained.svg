<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">BM25 explained</title><desc id="desc">BM25 formula with term frequency, inverse document frequency, length normalization, k1 and b explanations.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03080d"/><stop offset="1" stop-color="#06141e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="760" rx="18" fill="url(#bg)"/><g stroke="#163244" opacity=".34"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200M0 640H1200"/><path d="M100 0V760M200 0V760M300 0V760M400 0V760M500 0V760M600 0V760M700 0V760M800 0V760M900 0V760M1000 0V760M1100 0V760"/></g>
<text x="48" y="66" fill="#69ff84" font-size="18" font-family="monospace" font-weight="700">SCOUT LEARN · SEARCH &amp; RANKING</text><text x="48" y="125" fill="#f4f8fa" font-size="48" font-family="Arial,sans-serif" font-weight="800">BM25 explained</text><text x="48" y="158" fill="#91a8b5" font-size="20" font-family="Arial,sans-serif">Lexical ranking: reward the right terms, but control repetition and document length.</text>
<rect x="48" y="194" width="1104" height="178" rx="12" fill="#07121b" stroke="#24506a"/><text x="72" y="228" fill="#69ff84" font-size="17" font-family="monospace" font-weight="700">THE FORMULA</text><text x="82" y="298" fill="#ecf4f7" font-size="28" font-family="Georgia,serif">score(D,Q) = Σ IDF(q) × [ f(q,D) × (k₁ + 1) ] / [ f(q,D) + k₁ × (1 − b + b × |D| / avgdl) ]</text><text x="82" y="342" fill="#7ebfe8" font-size="17" font-family="Arial,sans-serif">Scout constants: k₁ = 1.2</text><text x="326" y="342" fill="#9ef5a8" font-size="17" font-family="Arial,sans-serif">b = 0.75</text><text x="484" y="342" fill="#91a8b5" font-size="17" font-family="Arial,sans-serif">Each query term contributes its own score, then the terms are summed.</text>
<g font-family="Arial,sans-serif"><rect x="48" y="400" width="258" height="172" rx="10" fill="#07131b" stroke="#2a6e48"/><text x="70" y="433" fill="#69ff84" font-size="18" font-weight="700">1 · IDF: term rarity</text><text x="70" y="466" fill="#c8d7de" font-size="16">A term found in fewer documents</text><text x="70" y="490" fill="#c8d7de" font-size="16">gets more weight. Common terms</text><text x="70" y="514" fill="#c8d7de" font-size="16">carry less information.</text><text x="70" y="548" fill="#87a0ad" font-size="14">Rare term → larger contribution</text>
<rect x="330" y="400" width="258" height="172" rx="10" fill="#07131b" stroke="#2676a2"/><text x="352" y="433" fill="#59c9ff" font-size="18" font-weight="700">2 · TF saturation</text><text x="352" y="466" fill="#c8d7de" font-size="16">More occurrences help, but the</text><text x="352" y="490" fill="#c8d7de" font-size="16">gain shrinks. k₁ controls how</text><text x="352" y="514" fill="#c8d7de" font-size="16">quickly repetition saturates.</text><text x="352" y="548" fill="#87a0ad" font-size="14">No unlimited reward for repetition</text>
<rect x="612" y="400" width="258" height="172" rx="10" fill="#07131b" stroke="#725aa4"/><text x="634" y="433" fill="#c59cff" font-size="18" font-weight="700">3 · Length normalization</text><text x="634" y="466" fill="#c8d7de" font-size="16">Long documents naturally contain</text><text x="634" y="490" fill="#c8d7de" font-size="16">more words. b reduces that unfair</text><text x="634" y="514" fill="#c8d7de" font-size="16">advantage using |D| / avgdl.</text><text x="634" y="548" fill="#87a0ad" font-size="14">b = 0 means no length correction</text>
<rect x="894" y="400" width="258" height="172" rx="10" fill="#07131b" stroke="#92722d"/><text x="916" y="433" fill="#ffd36d" font-size="18" font-weight="700">4 · Result: a rank score</text><text x="916" y="466" fill="#c8d7de" font-size="16">BM25 outputs a relevance score.</text><text x="916" y="490" fill="#c8d7de" font-size="16">It is not a probability and does not</text><text x="916" y="514" fill="#c8d7de" font-size="16">mean “81% relevant.”</text><text x="916" y="548" fill="#87a0ad" font-size="14">Use scores to order one query's results</text></g>
<rect x="48" y="602" width="1104" height="110" rx="10" fill="#07121b" stroke="#255e3b"/><text x="70" y="638" fill="#69ff84" font-size="17" font-family="monospace" font-weight="700">INTUITION</text><text x="70" y="675" fill="#e3edf1" font-size="21" font-family="Arial,sans-serif">BM25 balances term importance + repeated-term evidence + document length.</text><text x="70" y="699" fill="#91a8b5" font-size="15" font-family="Arial,sans-serif">In Scout, this is deterministic JavaScript over local chunks. The language model is not involved in BM25 scoring.</text></svg>