<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Edit distance and typo correction</title><desc id="d">Dynamic-programming edit distance using insertion, deletion, substitution and Scout's adjacent-transposition variant.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03080d"/><stop offset="1" stop-color="#06141e"/></linearGradient></defs><rect width="1200" height="800" rx="18" fill="url(#bg)"/><g stroke="#173044" opacity=".3"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200"/><path d="M120 0V800M240 0V800M360 0V800M480 0V800M600 0V800M720 0V800M840 0V800M960 0V800M1080 0V800"/></g><text x="48" y="64" fill="#69ff84" font-size="18" font-family="monospace" font-weight="700">SCOUT LEARN · TYPO TOLERANCE</text><text x="48" y="120" fill="#f3f8fa" font-size="44" font-family="Arial,sans-serif" font-weight="800">Edit distance: how far apart are two strings?</text><text x="48" y="153" fill="#8ea6b3" font-size="19" font-family="Arial,sans-serif">Dynamic programming finds the minimum-cost edit path instead of guessing from visual similarity.</text>
<g font-family="Arial,sans-serif"><rect x="48" y="190" width="305" height="242" rx="10" fill="#07121b" stroke="#2d6d48"/><text x="70" y="224" fill="#69ff84" font-size="18" font-weight="700">Basic Levenshtein edits</text><text x="74" y="270" fill="#dce8ed" font-size="18">＋ insertion · cost 1</text><text x="74" y="310" fill="#dce8ed" font-size="18">− deletion · cost 1</text><text x="74" y="350" fill="#dce8ed" font-size="18">↺ substitution · cost 1</text><text x="70" y="395" fill="#8da4b0" font-size="15">Classic Levenshtein uses these three.</text>
<rect x="48" y="454" width="305" height="128" rx="10" fill="#07121b" stroke="#8e702e"/><text x="70" y="488" fill="#ffd36d" font-size="17" font-weight="700">Scout implementation note</text><text x="70" y="522" fill="#dce8ed" font-size="16">Scout also permits one adjacent swap</text><text x="70" y="548" fill="#dce8ed" font-size="16">for the restricted Damerau / Optimal</text><text x="70" y="572" fill="#dce8ed" font-size="16">String Alignment-style recurrence.</text></g>
<rect x="382" y="190" width="770" height="392" rx="10" fill="#07121b" stroke="#2876a4"/><text x="406" y="224" fill="#59c9ff" font-size="18" font-family="monospace" font-weight="700">WORKED MATRIX · “pyton” → “python”</text><text x="406" y="256" fill="#9bb0bc" font-size="15" font-family="Arial,sans-serif">Each cell stores the best distance between two prefixes. The bottom-right value is the final distance.</text>
<g font-family="monospace" font-size="18" text-anchor="middle"><text x="575" y="300" fill="#59c9ff">∅</text><text x="645" y="300" fill="#59c9ff">p</text><text x="715" y="300" fill="#59c9ff">y</text><text x="785" y="300" fill="#59c9ff">t</text><text x="855" y="300" fill="#59c9ff">h</text><text x="925" y="300" fill="#59c9ff">o</text><text x="995" y="300" fill="#59c9ff">n</text>
<text x="505" y="342" fill="#69ff84">∅</text><text x="505" y="384" fill="#69ff84">p</text><text x="505" y="426" fill="#69ff84">y</text><text x="505" y="468" fill="#69ff84">t</text><text x="505" y="510" fill="#69ff84">o</text><text x="505" y="552" fill="#69ff84">n</text></g>
<g stroke="#254153" fill="none"><path d="M540 316H1030M540 358H1030M540 400H1030M540 442H1030M540 484H1030M540 526H1030M540 568H1030"/><path d="M540 316V568M610 316V568M680 316V568M750 316V568M820 316V568M890 316V568M960 316V568M1030 316V568"/></g>
<g fill="#d7e3e9" font-family="monospace" font-size="17" text-anchor="middle"><text x="575" y="344">0</text><text x="645" y="344">1</text><text x="715" y="344">2</text><text x="785" y="344">3</text><text x="855" y="344">4</text><text x="925" y="344">5</text><text x="995" y="344">6</text><text x="575" y="386">1</text><text x="645" y="386">0</text><text x="715" y="386">1</text><text x="785" y="386">2</text><text x="855" y="386">3</text><text x="925" y="386">4</text><text x="995" y="386">5</text><text x="575" y="428">2</text><text x="645" y="428">1</text><text x="715" y="428">0</text><text x="785" y="428">1</text><text x="855" y="428">2</text><text x="925" y="428">3</text><text x="995" y="428">4</text><text x="575" y="470">3</text><text x="645" y="470">2</text><text x="715" y="470">1</text><text x="785" y="470">0</text><text x="855" y="470">1</text><text x="925" y="470">2</text><text x="995" y="470">3</text><text x="575" y="512">4</text><text x="645" y="512">3</text><text x="715" y="512">2</text><text x="785" y="512">1</text><text x="855" y="512">1</text><text x="925" y="512">1</text><text x="995" y="512">2</text><text x="575" y="554">5</text><text x="645" y="554">4</text><text x="715" y="554">3</text><text x="785" y="554">2</text><text x="855" y="554">2</text><text x="925" y="554">2</text><text x="995" y="554" fill="#69ff84" font-weight="700">1</text></g><rect x="963" y="529" width="64" height="38" rx="5" fill="none" stroke="#69ff84" stroke-width="3"/>
<rect x="382" y="606" width="770" height="126" rx="10" fill="#07121b" stroke="#2d6d48"/><text x="406" y="640" fill="#69ff84" font-size="17" font-family="monospace" font-weight="700">HOW SCOUT USES THE IDEA</text><text x="406" y="675" fill="#dce8ed" font-size="17" font-family="Arial,sans-serif">unknown query term → compare against corpus vocabulary → keep a close match only inside a small threshold</text><text x="406" y="706" fill="#8ea6b3" font-size="15" font-family="Arial,sans-serif">Example: a transposed spelling can be distance 1, so retrieval can recover without treating unrelated words as equivalent.</text><rect x="48" y="606" width="305" height="126" rx="10" fill="#07121b" stroke="#2e7a6c"/><text x="70" y="642" fill="#66e8cf" font-size="17" font-family="monospace" font-weight="700">COMPLEXITY</text><text x="70" y="681" fill="#edf4f7" font-size="27" font-family="Georgia,serif">O(m × n)</text><text x="70" y="710" fill="#8ea6b3" font-size="14" font-family="Arial,sans-serif">for strings of lengths m and n</text></svg>