<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">How Scout Works</title><desc id="desc">Eight-stage request flow from browser widget through retrieval, response contracts, generation, validation and telemetry.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03090e"/><stop offset="1" stop-color="#07131b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.t{font-family:Inter,Arial,sans-serif;fill:#edf5f8}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.mut{fill:#8ea3b0}.g{fill:#69ff84}.c{fill:#63d8ff}.card{fill:#07121b;stroke:#244150;stroke-width:1.2}.line{stroke:#69ff84;stroke-width:3;fill:none;stroke-linecap:round}.n{fill:#69ff84}.num{fill:#031009;font:bold 14px Inter,Arial}.h{font:bold 16px Inter,Arial}.s{font:12px Inter,Arial}.tag{font:bold 11px ui-monospace,monospace;letter-spacing:1px}</style></defs>
<rect width="1200" height="675" rx="18" fill="url(#bg)"/><g opacity=".13" stroke="#3e738a" stroke-width="1"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200"/><path d="M80 0V675M160 0V675M240 0V675M320 0V675M400 0V675M480 0V675M560 0V675M640 0V675M720 0V675M800 0V675M880 0V675M960 0V675M1040 0V675M1120 0V675"/></g>
<text x="42" y="55" class="t m tag g">SCOUT · DOCS</text><text x="42" y="110" class="t" font-size="40" font-weight="800">How Scout Works</text><text x="42" y="142" class="t mut" font-size="17">Request flow from question to grounded answer</text>
<g transform="translate(35 190)">
<path class="line" d="M130 115H160M270 115H300M410 115H440M550 115H580M690 115H720M830 115H860M970 115H1000" filter="url(#glow)"/>
<g transform="translate(0)"><rect class="card" width="130" height="255" rx="10"/><circle class="n" cx="20" cy="22" r="12"/><text class="num" x="16" y="27">1</text><text class="t h" x="42" y="28">Browser</text><text class="t h" x="14" y="52">Widget</text><rect x="22" y="82" width="86" height="58" rx="8" fill="#061019" stroke="#63d8ff"/><circle cx="45" cy="111" r="5" class="g"/><circle cx="65" cy="111" r="5" class="g"/><circle cx="85" cy="111" r="5" class="g"/><text class="t s mut" x="14" y="173">User asks a question.</text><text class="t s mut" x="14" y="194">The widget sends the</text><text class="t s mut" x="14" y="215">message and context.</text></g>
<g transform="translate(160)"><rect class="card" width="110" height="255" rx="10"/><circle class="n" cx="20" cy="22" r="12"/><text class="num" x="16" y="27">2</text><text class="t h" x="42" y="28">Express</text><text class="t h" x="14" y="52">API</text><path d="M55 83l29 17v34l-29 17-29-17v-34z" fill="#071c2a" stroke="#63d8ff" stroke-width="2"/><text class="c" x="36" y="122" font-size="20" font-weight="800">API</text><text class="t s mut" x="14" y="176">Applies limits, CORS,</text><text class="t s mut" x="14" y="197">deadlines and runtime</text><text class="t s mut" x="14" y="218">controls.</text></g>
<g transform="translate(300)"><rect class="card" width="110" height="255" rx="10"/><circle class="n" cx="20" cy="22" r="12"/><text class="num" x="16" y="27">3</text><text class="t h" x="42" y="28">Query</text><text class="t h" x="14" y="52">Understanding</text><circle cx="55" cy="114" r="34" fill="#071c2a" stroke="#63d8ff" stroke-width="2"/><path d="M30 114h50M55 82v64M38 91c10 10 10 36 0 46M72 91c-10 10-10 36 0 46" stroke="#69ff84" fill="none"/><text class="t s mut" x="14" y="176">Normalize, protect terms,</text><text class="t s mut" x="14" y="197">resolve context and</text><text class="t s mut" x="14" y="218">prepare search views.</text></g>
<g transform="translate(440)"><rect class="card" width="110" height="255" rx="10"/><circle class="n" cx="20" cy="22" r="12"/><text class="num" x="16" y="27">4</text><text class="t h" x="42" y="28">BM25</text><text class="t h" x="14" y="52">+ RRF</text><ellipse cx="48" cy="95" rx="28" ry="10" fill="#071c2a" stroke="#63d8ff"/><path d="M20 95v38c0 6 56 6 56 0V95M20 113c0 6 56 6 56 0" fill="none" stroke="#63d8ff"/><circle cx="79" cy="132" r="17" fill="#061019" stroke="#69ff84" stroke-width="2"/><path d="M91 145l14 14" class="line"/><text class="t s mut" x="14" y="176">Rank verified chunks.</text><text class="t s mut" x="14" y="197">Fuse contextual rankings</text><text class="t s mut" x="14" y="218">when useful.</text></g>
<g transform="translate(580)"><rect class="card" width="110" height="255" rx="10"/><circle class="n" cx="20" cy="22" r="12"/><text class="num" x="16" y="27">5</text><text class="t h" x="42" y="28">Contract</text><text class="t h" x="14" y="52">+ Tools</text><path d="M55 82l32 14v24c0 22-14 34-32 43-18-9-32-21-32-43V96z" fill="#071c2a" stroke="#63d8ff" stroke-width="2"/><path d="M41 119l10 10 20-24" fill="none" stroke="#69ff84" stroke-width="4"/><text class="t s mut" x="14" y="176">Define allowed claims,</text><text class="t s mut" x="14" y="197">required evidence and</text><text class="t s mut" x="14" y="218">read-only tool use.</text></g>
<g transform="translate(720)"><rect class="card" width="110" height="255" rx="10"/><circle class="n" cx="20" cy="22" r="12"/><text class="num" x="16" y="27">6</text><text class="t h" x="42" y="28">Model</text><text class="t h" x="14" y="52">Generation</text><path d="M55 79l8 25 25 8-25 8-8 25-8-25-25-8 25-8z" fill="#63d8ff"/><circle cx="88" cy="88" r="5" class="g"/><text class="t s mut" x="14" y="176">Cloudflare 8B Fast writes</text><text class="t s mut" x="14" y="197">natural language from the</text><text class="t s mut" x="14" y="218">bounded packet.</text></g>
<g transform="translate(860)"><rect class="card" width="110" height="255" rx="10"/><circle class="n" cx="20" cy="22" r="12"/><text class="num" x="16" y="27">7</text><text class="t h" x="42" y="28">Validate</text><text class="t h" x="14" y="52">/ Repair</text><path d="M28 82h50l18 18v57H28z" fill="#071c2a" stroke="#63d8ff" stroke-width="2"/><path d="M40 110h38M40 124h30M40 138h25" stroke="#63d8ff"/><circle cx="80" cy="142" r="18" fill="#061019" stroke="#69ff84" stroke-width="2"/><path d="M71 142l6 6 12-14" fill="none" stroke="#69ff84" stroke-width="3"/><text class="t s mut" x="14" y="176">Check entities, numbers,</text><text class="t s mut" x="14" y="197">relationships, polarity</text><text class="t s mut" x="14" y="218">and provenance.</text></g>
<g transform="translate(1000)"><rect class="card" width="130" height="255" rx="10"/><circle class="n" cx="20" cy="22" r="12"/><text class="num" x="16" y="27">8</text><text class="t h" x="42" y="28">Reply</text><text class="t h" x="14" y="52">+ Telemetry</text><rect x="22" y="82" width="86" height="60" rx="10" fill="#071c2a" stroke="#63d8ff"/><path d="M84 106v25M96 96v35M108 114v17" stroke="#69ff84" stroke-width="4"/><text class="t s mut" x="14" y="176">Return the accepted</text><text class="t s mut" x="14" y="197">answer and record</text><text class="t s mut" x="14" y="218">runtime metadata.</text></g>
</g>
<g transform="translate(70 500)"><rect class="card" width="320" height="105" rx="10" stroke="#69ff84"/><text class="g h" x="22" y="32">PRODUCTION</text><text class="t" x="22" y="58" font-size="15" font-weight="700">Cloudflare Workers AI · Llama 3.1 8B Fast</text><text class="mut s" x="22" y="82">Normal hosted generation path.</text></g><g transform="translate(440 500)"><rect class="card" width="300" height="105" rx="10"/><text class="c h" x="22" y="32">DEVELOPMENT</text><text class="t" x="22" y="58" font-size="15" font-weight="700">Ollama evaluation path</text><text class="mut s" x="22" y="82">Local inference and gated fallback work.</text></g><g transform="translate(790 500)"><rect class="card" width="340" height="105" rx="10"/><text class="g h" x="22" y="32">STATE</text><text class="t" x="22" y="58" font-size="15" font-weight="700">Server-owned conversation state</text><text class="mut s" x="22" y="82">Recent turns, referents and active context.</text></g>
<text x="600" y="646" text-anchor="middle" class="mut m" font-size="11">Visual summary. Exact routing and current release state are documented beside this diagram.</text></svg>