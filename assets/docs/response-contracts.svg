<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Response Contracts</title><desc id="desc">How Scout classifies a request, establishes fact state and claim boundaries, selects evidence and tools, and creates instructions for model generation.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03090e"/><stop offset="1" stop-color="#07131b"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif;fill:#edf5f8}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.mut{fill:#8ea3b0}.g{fill:#69ff84}.c{fill:#63d8ff}.r{fill:#ff777e}.card{fill:#07121b;stroke:#244150;stroke-width:1.2}.line{stroke:#69ff84;stroke-width:3;fill:none}.h{font:bold 15px Inter,Arial}.s{font:11px Inter,Arial}.tag{font:bold 10px ui-monospace,monospace;letter-spacing:.7px}</style></defs><rect width="1200" height="675" rx="18" fill="url(#bg)"/><g opacity=".12" stroke="#3e738a"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200"/><path d="M80 0V675M160 0V675M240 0V675M320 0V675M400 0V675M480 0V675M560 0V675M640 0V675M720 0V675M800 0V675M880 0V675M960 0V675M1040 0V675M1120 0V675"/></g><text x="42" y="54" class="g m tag">SCOUT · RESPONSE PLANNING</text><text x="42" y="104" class="t" font-size="40" font-weight="800">Response Contracts</text><text x="42" y="136" class="mut t" font-size="17">How deterministic code constrains what generation is allowed to claim</text>
<g transform="translate(32 175)"><path class="line" d="M132 116H150M282 116H300M432 116H450M582 116H600M732 116H750M882 116H900M1032 116H1050"/><g><rect class="card" width="132" height="265" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">1</text><text x="42" y="26" class="t h">Question</text><path d="M34 76h64v55H58l-17 16v-16h-7z" fill="#071c2a" stroke="#63d8ff" stroke-width="2"/><circle cx="54" cy="103" r="4" class="g"/><circle cx="67" cy="103" r="4" class="g"/><circle cx="80" cy="103" r="4" class="g"/><text x="15" y="181" class="mut s">Original user wording</text><text x="15" y="199" class="mut s">and recent context.</text></g><g transform="translate(150)"><rect class="card" width="132" height="265" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">2</text><text x="42" y="26" class="t h">Intent</text><g transform="translate(14 58)"><rect width="104" height="23" rx="4" fill="#09202a" stroke="#2d576a"/><text x="8" y="16" class="c m tag">PROFILE</text><rect y="31" width="104" height="23" rx="4" fill="#09202a" stroke="#2d576a"/><text x="8" y="47" class="c m tag">EXPERIENCE</text><rect y="62" width="104" height="23" rx="4" fill="#09202a" stroke="#2d576a"/><text x="8" y="78" class="c m tag">QUALIFICATIONS</text><rect y="93" width="104" height="23" rx="4" fill="#09202a" stroke="#2d576a"/><text x="8" y="109" class="c m tag">META / REFUSAL</text><rect y="124" width="104" height="23" rx="4" fill="#09202a" stroke="#2d576a"/><text x="8" y="140" class="c m tag">FUTURE_CAP.</text></g><text x="15" y="224" class="mut s">Classify the kind of</text><text x="15" y="242" class="mut s">answer being requested.</text></g><g transform="translate(300)"><rect class="card" width="132" height="265" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">3</text><text x="42" y="26" class="t h">Fact state</text><rect x="20" y="65" width="92" height="38" rx="6" fill="#071c15" stroke="#69ff84"/><text x="38" y="89" class="g h">TRUE</text><rect x="20" y="113" width="92" height="38" rx="6" fill="#1b0d12" stroke="#ff777e"/><text x="35" y="137" class="r h">FALSE</text><rect x="20" y="161" width="92" height="38" rx="6" fill="#071827" stroke="#63d8ff"/><text x="29" y="185" class="c h">UNKNOWN</text><text x="15" y="229" class="mut s">Evidence state is not</text><text x="15" y="247" class="mut s">model confidence.</text></g><g transform="translate(450)"><rect class="card" width="132" height="265" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">4</text><text x="42" y="26" class="t h">Entities</text><path d="M33 67h66v75H33z" fill="#071c2a" stroke="#63d8ff"/><circle cx="55" cy="92" r="10" fill="none" stroke="#69ff84"/><path d="M42 124c3-15 24-15 27 0M75 84h17M75 101h17M75 118h17" fill="none" stroke="#63d8ff"/><text x="16" y="170" class="mut s">Person / company</text><text x="16" y="188" class="mut s">Role / title</text><text x="16" y="206" class="mut s">Time / source</text><text x="16" y="238" class="mut s">Track what a claim is</text><text x="16" y="254" class="mut s">actually about.</text></g><g transform="translate(600)"><rect class="card" width="132" height="265" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">5</text><text x="42" y="26" class="t h">Claim ceiling</text><path d="M66 65l38 16v29c0 27-16 43-38 54-22-11-38-27-38-54V81z" fill="#071c2a" stroke="#63d8ff" stroke-width="2"/><path d="M45 134h42M45 115h34M45 96h25" stroke="#69ff84" stroke-width="3"/><text x="15" y="193" class="mut s">Strongest wording</text><text x="15" y="211" class="mut s">supported by current</text><text x="15" y="229" class="mut s">evidence and policy.</text></g><g transform="translate(750)"><rect class="card" width="132" height="265" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">6</text><text x="42" y="26" class="t h">Tools</text><circle cx="64" cy="107" r="34" fill="#071c2a" stroke="#63d8ff" stroke-width="2"/><path d="M88 132l20 20" class="line"/><rect x="73" y="120" width="35" height="31" rx="5" fill="#061019" stroke="#69ff84"/><path d="M81 120v-7c0-12 19-12 19 0v7" fill="none" stroke="#69ff84"/><text x="25" y="179" class="g m tag">READ ONLY</text><text x="15" y="207" class="mut s">Optional structured</text><text x="15" y="225" class="mut s">evidence lookup.</text></g><g transform="translate(900)"><rect class="card" width="132" height="265" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">7</text><text x="42" y="26" class="t h">Answer shape</text><g transform="translate(15 60)"><rect width="102" height="34" rx="5" fill="#09202a"/><text x="8" y="21" class="t s">direct answer</text><rect y="43" width="102" height="34" rx="5" fill="#09202a"/><text x="8" y="64" class="t s">key facts</text><rect y="86" width="102" height="34" rx="5" fill="#09202a"/><text x="8" y="107" class="t s">boundaries</text><rect y="129" width="102" height="34" rx="5" fill="#09202a"/><text x="8" y="150" class="t s">required mentions</text></g><text x="15" y="238" class="mut s">Plan before prose.</text></g><g transform="translate(1050)"><rect class="card" width="118" height="265" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">8</text><text x="42" y="26" class="t h">Packet</text><path d="M59 70l35 20v40l-35 20-35-20V90z" fill="#071c2a" stroke="#63d8ff" stroke-width="2"/><path d="M24 90l35 20 35-20M59 110v40" fill="none" stroke="#63d8ff"/><text x="12" y="188" class="mut s">Model receives bounded</text><text x="12" y="206" class="mut s">facts + instructions,</text><text x="12" y="224" class="mut s">not all app state.</text></g></g>
<g transform="translate(55 500)"><rect class="card" width="340" height="105" rx="10"/><text x="18" y="30" class="g h">Potential ≠ current evidence</text><text x="18" y="56" class="mut s">Future capability uses a different claim ceiling.</text><text x="18" y="76" class="mut s">It cannot silently become present-tense experience.</text></g><g transform="translate(430 500)"><rect class="card" width="340" height="105" rx="10"/><text x="18" y="30" class="g h">Public contact ≠ private data</text><text x="18" y="56" class="mut s">Deterministic routing separates allowed contact</text><text x="18" y="76" class="mut s">questions from sensitive/exhaustive personal requests.</text></g><g transform="translate(805 500)"><rect class="card" width="340" height="105" rx="10"/><text x="18" y="30" class="g h">Contract ≠ guarantee</text><text x="18" y="56" class="mut s">The contract narrows generation. Validators still check</text><text x="18" y="76" class="mut s">the actual output and can repair or reject it.</text></g><text x="600" y="646" text-anchor="middle" class="mut m" font-size="10">These are deterministic response-planning concepts. Exact fields and current intent rules are documented in response-contract.js and the Docs text.</text></svg>