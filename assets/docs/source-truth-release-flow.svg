<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Source of Truth and Release Flow</title><desc id="desc">Production master, integration develop and staging ProjectHub-dev are separate states. Release gates determine when integrated work can become production.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03090e"/><stop offset="1" stop-color="#07131b"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif;fill:#edf5f8}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.mut{fill:#8ea3b0}.g{fill:#69ff84}.c{fill:#63d8ff}.r{fill:#ff777e}.card{fill:#07121b;stroke:#244150;stroke-width:1.2}.line{stroke:#69ff84;stroke-width:3;fill:none}.dash{stroke:#69ff84;stroke-width:2;fill:none;stroke-dasharray:5 6}.h{font:bold 16px Inter,Arial}.s{font:12px Inter,Arial}.tag{font:bold 10px ui-monospace,monospace;letter-spacing:.7px}</style></defs><rect width="1200" height="675" rx="18" fill="url(#bg)"/><g opacity=".12" stroke="#3e738a"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200"/><path d="M80 0V675M160 0V675M240 0V675M320 0V675M400 0V675M480 0V675M560 0V675M640 0V675M720 0V675M800 0V675M880 0V675M960 0V675M1040 0V675M1120 0V675"/></g><text x="42" y="54" class="g m tag">SCOUT · RELEASES</text><text x="42" y="104" class="t" font-size="40" font-weight="800">Source of Truth &amp; Release Flow</text><text x="42" y="136" class="mut t" font-size="17">Production, integrated development and staging are different states</text>
<g transform="translate(55 175)"><g><rect class="card" width="330" height="135" rx="10" stroke="#69ff84"/><text x="20" y="32" class="g h">Production / master</text><rect x="229" y="14" width="82" height="26" rx="4" fill="#071c15" stroke="#69ff84"/><text x="244" y="31" class="g m tag">RELEASED</text><text x="20" y="65" class="t" font-size="14" font-weight="700">Released customer-facing behavior.</text><text x="20" y="90" class="mut s">Production claims come from code and runtime</text><text x="20" y="109" class="mut s">configuration on the released source line.</text></g><g transform="translate(380)"><rect class="card" width="330" height="135" rx="10" stroke="#63d8ff"/><text x="20" y="32" class="c h">Integration / develop</text><rect x="236" y="14" width="75" height="26" rx="4" fill="#071827" stroke="#63d8ff"/><text x="250" y="31" class="c m tag">DEVELOP</text><text x="20" y="65" class="t" font-size="14" font-weight="700">Current integrated work.</text><text x="20" y="90" class="mut s">May be newer than production. It is not a</text><text x="20" y="109" class="mut s">production feature until release gates pass.</text></g><g transform="translate(760)"><rect class="card" width="330" height="135" rx="10"/><text x="20" y="32" class="g h">Staging / ProjectHub-dev</text><rect x="232" y="14" width="79" height="26" rx="4" fill="#071c15" stroke="#69ff84"/><text x="244" y="31" class="g m tag">STAGING</text><text x="20" y="65" class="t" font-size="14" font-weight="700">Deployment mirror used for validation.</text><text x="20" y="90" class="mut s">Its source marker identifies the exact develop</text><text x="20" y="109" class="mut s">commit used. It can lag current develop.</text></g><path class="dash" d="M165 145v25h760v-25M545 145v25"/></g>
<text x="55" y="355" class="g m tag">RELEASE GATE PIPELINE</text><g transform="translate(55 375)"><path class="line" d="M145 75h28M318 75h28M491 75h28M664 75h28M837 75h28"/><g><rect class="card" width="145" height="150" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">1</text><text x="18" y="57" class="t h">Unit tests</text><text x="18" y="83" class="mut s">Code-level behavior</text><text x="18" y="101" class="mut s">and regressions.</text><text x="18" y="130" class="c m tag">npm test</text></g><g transform="translate(173)"><rect class="card" width="145" height="150" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">2</text><text x="18" y="57" class="t h">Retrieval eval</text><text x="18" y="83" class="mut s">Golden query set,</text><text x="18" y="101" class="mut s">Recall@6 + MRR@6.</text><text x="18" y="130" class="c m tag">eval-retrieval</text></g><g transform="translate(346)"><rect class="card" width="145" height="150" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">3</text><text x="18" y="57" class="t h">API evals</text><text x="18" y="83" class="mut s">Scenario and bounded</text><text x="18" y="101" class="mut s">response evaluation.</text><text x="18" y="130" class="c m tag">eval:local-api</text></g><g transform="translate(519)"><rect class="card" width="145" height="150" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">4</text><text x="18" y="57" class="t h">Browser QA</text><text x="18" y="83" class="mut s">Embedded widget and</text><text x="18" y="101" class="mut s">multi-turn UI behavior.</text><text x="18" y="130" class="c m tag">Playwright</text></g><g transform="translate(692)"><rect class="card" width="145" height="150" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">5</text><text x="18" y="57" class="t h">Conversation</text><text x="18" y="78" class="t h">regression</text><text x="18" y="104" class="mut s">Retained multi-turn</text><text x="18" y="122" class="mut s">behavioral cases.</text></g><g transform="translate(865)"><rect class="card" width="145" height="150" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">6</text><text x="18" y="57" class="t h">Decision</text><text x="18" y="83" class="mut s">Review all gates and</text><text x="18" y="101" class="mut s">material failures.</text><text x="18" y="130" class="g m tag">RELEASE?</text></g></g><g transform="translate(1035 385)"><rect width="125" height="60" rx="8" fill="#071c15" stroke="#69ff84"/><text x="20" y="26" class="g h">RELEASE</text><text x="20" y="45" class="mut s">promote to master</text><rect y="78" width="125" height="60" rx="8" fill="#1b0d12" stroke="#ff777e"/><text x="20" y="104" class="r h">NO RELEASE</text><text x="20" y="123" class="mut s">fix + re-run gates</text></g>
<g transform="translate(85 565)"><text class="g h">Rule 1</text><text x="65" class="mut s">Production claims come from master.</text></g><g transform="translate(410 565)"><text class="c h">Rule 2</text><text x="65" class="mut s">Develop behavior is labeled unreleased until promoted.</text></g><g transform="translate(805 565)"><text class="g h">Rule 3</text><text x="65" class="mut s">Staging provenance is checked separately from develop HEAD.</text></g><text x="600" y="630" text-anchor="middle" class="mut m" font-size="10">This diagram describes the release model. Current SHAs and gate results are reported in the live snapshot and changelog, not hard-coded here.</text></svg>