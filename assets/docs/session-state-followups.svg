<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Session State and Follow-ups</title><desc id="desc">How Scout stores short-lived server-side conversation state and uses it to resolve follow-up references.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03090e"/><stop offset="1" stop-color="#07131b"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif;fill:#edf5f8}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.mut{fill:#8ea3b0}.g{fill:#69ff84}.c{fill:#63d8ff}.y{fill:#f0c86e}.card{fill:#07121b;stroke:#244150;stroke-width:1.2}.line{stroke:#69ff84;stroke-width:3;fill:none}.h{font:bold 16px Inter,Arial}.s{font:12px Inter,Arial}.tag{font:bold 10px ui-monospace,monospace;letter-spacing:.7px}</style></defs><rect width="1200" height="675" rx="18" fill="url(#bg)"/><g opacity=".12" stroke="#3e738a"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200"/><path d="M80 0V675M160 0V675M240 0V675M320 0V675M400 0V675M480 0V675M560 0V675M640 0V675M720 0V675M800 0V675M880 0V675M960 0V675M1040 0V675M1120 0V675"/></g><text x="42" y="54" class="g m tag">SCOUT · CONTEXT</text><text x="42" y="104" class="t" font-size="40" font-weight="800">Session State &amp; Follow-ups</text><text x="42" y="136" class="mut t" font-size="17">Short-lived server state makes conversational references explicit</text>
<g transform="translate(45 185)"><g><rect class="card" width="235" height="270" rx="10"/><circle cx="22" cy="22" r="12" class="g"/><text x="18" y="27" fill="#031009" font-weight="800">1</text><text x="44" y="28" class="t h">Initial question</text><text x="20" y="72" class="c m tag">USER</text><text x="20" y="100" class="t" font-size="16">Tell me about ProjectHub.</text><path d="M20 125h195" stroke="#244150" stroke-dasharray="4 5"/><text x="20" y="155" class="g m tag">SCOUT</text><text x="20" y="183" class="mut s">Answer uses ProjectHub evidence.</text><text x="20" y="209" class="mut s">State records the active project</text><text x="20" y="227" class="mut s">and recent conversation turn.</text></g><path class="line" d="M245 135h55"/><g transform="translate(310)"><rect class="card" width="470" height="270" rx="10" stroke="#63d8ff"/><circle cx="22" cy="22" r="12" class="g"/><text x="18" y="27" fill="#031009" font-weight="800">2</text><text x="44" y="28" class="t h">Server-owned session state</text><text x="22" y="57" class="mut s">In-memory context used for this conversation. Current implementation TTL: about 2 hours.</text><line x1="235" y1="78" x2="235" y2="235" stroke="#244150"/><g transform="translate(22 88)"><text class="g m tag" y="0">ACTIVE CONTEXT</text><text class="t s" y="29">• topic / intent</text><text class="t s" y="54">• active projects</text><text class="t s" y="79">• job context</text><text class="t s" y="104">• comparison context</text><text class="t s" y="129">• visitor name</text></g><g transform="translate(255 88)"><text class="c m tag" y="0">CONVERSATION MEMORY</text><text class="t s" y="29">• five recent compact turns</text><text class="t s" y="54">• unresolved references</text><text class="t s" y="79">• current entities</text><text class="t s" y="104">• stance / referent state</text><text class="mut s" y="137">Expires after inactivity.</text></g><rect x="20" y="238" width="430" height="20" rx="4" fill="#09202a"/><text x="32" y="252" class="mut m" font-size="10">This is session context, not permanent model training or world memory.</text></g><path class="line" d="M790 135h55"/><g transform="translate(855)"><rect class="card" width="255" height="270" rx="10"/><circle cx="22" cy="22" r="12" class="g"/><text x="18" y="27" fill="#031009" font-weight="800">3</text><text x="44" y="28" class="t h">Follow-up</text><text x="20" y="72" class="c m tag">USER</text><text x="20" y="100" class="t" font-size="17">What about <tspan class="g">that one</tspan>?</text><path d="M20 125h215" stroke="#244150" stroke-dasharray="4 5"/><text x="20" y="155" class="g m tag">RESOLUTION</text><text x="20" y="183" class="mut s">“that one” → ProjectHub</text><text x="20" y="210" class="mut s">The next retrieval/contract step</text><text x="20" y="228" class="mut s">can use the resolved entity.</text></g></g>
<g transform="translate(90 500)"><rect class="card" width="310" height="100" rx="10"/><text x="18" y="30" class="y h">Session memory is bounded</text><text x="18" y="56" class="mut s">It helps interpret the current conversation.</text><text x="18" y="76" class="mut s">It does not mean Scout remembers everything forever.</text></g><g transform="translate(445 500)"><rect class="card" width="310" height="100" rx="10"/><text x="18" y="30" class="y h">State is server-owned</text><text x="18" y="56" class="mut s">The backend maintains the canonical structured state.</text><text x="18" y="76" class="mut s">The browser still sends request/history data needed by the API.</text></g><g transform="translate(800 500)"><rect class="card" width="310" height="100" rx="10"/><text x="18" y="30" class="y h">Follow-ups are resolved explicitly</text><text x="18" y="56" class="mut s">References such as “it”, “there”, or “that one”</text><text x="18" y="76" class="mut s">are mapped back to tracked conversation entities when possible.</text></g><text x="600" y="644" text-anchor="middle" class="mut m" font-size="10">Illustrative conversation. Exact state fields, TTL and resolver behavior are documented in session-state.js and conversation-resolver.js.</text></svg>