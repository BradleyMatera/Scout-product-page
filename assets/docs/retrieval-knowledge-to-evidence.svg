<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Retrieval: From Knowledge to Evidence</title><desc id="desc">Scout retrieval pipeline from structured knowledge through chunks, tokenization, BM25 rankings, RRF fusion and evidence selection.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03090e"/><stop offset="1" stop-color="#07131b"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif;fill:#edf5f8}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.mut{fill:#8ea3b0}.g{fill:#69ff84}.c{fill:#63d8ff}.card{fill:#07121b;stroke:#244150;stroke-width:1.2}.line{stroke:#69ff84;stroke-width:3;fill:none}.h{font:bold 16px Inter,Arial}.s{font:12px Inter,Arial}.sm{font:11px Inter,Arial}.tag{font:bold 11px ui-monospace,monospace;letter-spacing:1px}</style></defs><rect width="1200" height="675" rx="18" fill="url(#bg)"/><g opacity=".12" stroke="#3e738a"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200"/><path d="M80 0V675M160 0V675M240 0V675M320 0V675M400 0V675M480 0V675M560 0V675M640 0V675M720 0V675M800 0V675M880 0V675M960 0V675M1040 0V675M1120 0V675"/></g><text x="42" y="54" class="g m tag">SCOUT · LEARN</text><text x="42" y="104" class="t" font-size="38" font-weight="800">Retrieval: From Knowledge to Evidence</text><text x="42" y="136" class="mut t" font-size="17">How Scout chooses context before generation</text>
<g transform="translate(42 175)"><path class="line" d="M160 118H182M342 118H364M524 118H546M706 118H728M888 118H910"/><g><rect class="card" width="160" height="245" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">1</text><text x="42" y="26" class="t h">Knowledge JSON</text><rect x="18" y="60" width="124" height="110" rx="6" fill="#041018" stroke="#1d5668"/><text x="30" y="82" class="g m sm">identity</text><text x="30" y="102" class="c m sm">experience[]</text><text x="30" y="122" class="c m sm">projects[]</text><text x="30" y="142" class="c m sm">skills</text><text x="30" y="162" class="c m sm">runtime facts</text><text x="18" y="202" class="mut s">Structured records are</text><text x="18" y="221" class="mut s">the source material.</text></g><g transform="translate(182)"><rect class="card" width="160" height="245" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">2</text><text x="42" y="26" class="t h">RAG chunks</text><rect x="18" y="58" width="124" height="34" rx="5" fill="#061823" stroke="#2d576a"/><text x="28" y="79" class="c m sm">project: ProjectHub…</text><rect x="18" y="101" width="124" height="34" rx="5" fill="#061823" stroke="#2d576a"/><text x="28" y="122" class="c m sm">experience: AWS…</text><rect x="18" y="144" width="124" height="34" rx="5" fill="#061823" stroke="#2d576a"/><text x="28" y="165" class="c m sm">skills: JavaScript…</text><text x="18" y="203" class="mut s">Records become searchable</text><text x="18" y="222" class="mut s">text with metadata.</text></g><g transform="translate(364)"><rect class="card" width="160" height="245" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">3</text><text x="42" y="26" class="t h">Tokenize</text><text x="18" y="65" class="mut s">Question:</text><text x="18" y="86" class="t s">"AWS support experience"</text><path class="line" d="M80 100v22"/><rect x="18" y="136" width="43" height="24" rx="4" fill="#09202a" stroke="#2d576a"/><text x="27" y="152" class="c m sm">aws</text><rect x="66" y="136" width="72" height="24" rx="4" fill="#09202a" stroke="#2d576a"/><text x="76" y="152" class="c m sm">support</text><rect x="38" y="170" width="86" height="24" rx="4" fill="#09202a" stroke="#2d576a"/><text x="48" y="186" class="c m sm">experience</text><text x="18" y="218" class="mut s">Lowercase, filter and stem</text><text x="18" y="236" class="mut s">for BM25 indexing/search.</text></g><g transform="translate(546)"><rect class="card" width="160" height="245" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">4</text><text x="42" y="26" class="t h">BM25 ranking</text><text x="18" y="66" class="mut s">Each chunk gets a lexical</text><text x="18" y="84" class="mut s">relevance score.</text><g transform="translate(22 105)"><rect width="116" height="25" rx="4" fill="#09202a"/><rect width="100" height="25" rx="4" fill="#123847"/><text x="8" y="17" class="t m sm">1 · experience</text><rect y="36" width="116" height="25" rx="4" fill="#09202a"/><rect y="36" width="76" height="25" rx="4" fill="#123847"/><text x="8" y="53" class="t m sm">2 · certifications</text><rect y="72" width="116" height="25" rx="4" fill="#09202a"/><rect y="72" width="50" height="25" rx="4" fill="#123847"/><text x="8" y="89" class="t m sm">3 · project</text></g><text x="18" y="225" class="mut s">Scores are not probabilities.</text></g><g transform="translate(728)"><rect class="card" width="160" height="245" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">5</text><text x="42" y="26" class="t h">RRF fusion</text><text x="18" y="64" class="mut s">Several ranked query views</text><text x="18" y="82" class="mut s">can vote by rank.</text><rect x="18" y="105" width="124" height="26" rx="4" fill="#09202a"/><text x="28" y="122" class="c m sm">literal → A B C</text><rect x="18" y="140" width="124" height="26" rx="4" fill="#09202a"/><text x="28" y="157" class="c m sm">rewrite → B A D</text><rect x="18" y="175" width="124" height="26" rx="4" fill="#09202a"/><text x="28" y="192" class="c m sm">context → A D B</text><text x="18" y="228" class="mut s">RRF combines rank positions.</text></g><g transform="translate(910)"><rect class="card" width="160" height="245" rx="9"/><circle cx="20" cy="20" r="11" class="g"/><text x="16" y="25" fill="#031009" font-weight="800">6</text><text x="42" y="26" class="t h">Evidence pack</text><g transform="translate(18 60)"><rect width="124" height="38" rx="5" fill="#071c2a" stroke="#69ff84"/><text x="10" y="16" class="g m sm">#1 experience</text><text x="10" y="31" class="mut m" font-size="9">role · company · dates</text><rect y="48" width="124" height="38" rx="5" fill="#071c2a" stroke="#2d576a"/><text x="10" y="64" class="c m sm">#2 certifications</text><text x="10" y="79" class="mut m" font-size="9">AWS credentials</text><rect y="96" width="124" height="38" rx="5" fill="#071c2a" stroke="#2d576a"/><text x="10" y="112" class="c m sm">#3 project</text><text x="10" y="127" class="mut m" font-size="9">supporting context</text></g><text x="18" y="220" class="mut s">Selected evidence becomes</text><text x="18" y="238" class="mut s">generation context.</text></g></g>
<g transform="translate(62 450)"><rect class="card" width="515" height="135" rx="10"/><text x="20" y="28" class="g h">BM25 · lexical relevance</text><text x="20" y="58" class="t m" font-size="13">score(D,Q) = Σ IDF(q) × [ f(q,D)(k₁+1) /</text><text x="147" y="80" class="t m" font-size="13">( f(q,D) + k₁(1-b+b|D|/avgdl) ) ]</text><text x="20" y="108" class="mut s">k₁ = term-frequency saturation · b = document-length normalization</text><text x="20" y="126" class="mut s">Scout currently uses k₁ = 1.2 and b = 0.75.</text></g><g transform="translate(620 450)"><rect class="card" width="515" height="135" rx="10"/><text x="20" y="28" class="g h">RRF · rank fusion</text><text x="20" y="61" class="t m" font-size="17">RRF(d) = Σ 1 / (k + rankᵢ(d))</text><text x="20" y="91" class="mut s">A document earns more credit when it appears near the top of several rankings.</text><text x="20" y="113" class="mut s">Scout uses k = 60. RRF compares ranks, not incompatible raw score scales.</text></g><text x="600" y="630" text-anchor="middle" class="g t" font-size="15" font-weight="700">Goal: retrieve the strongest available evidence before the model writes the answer.</text><text x="600" y="653" text-anchor="middle" class="mut m" font-size="10">See Learn Scout for the full equations, worked arithmetic and current implementation limits.</text></svg>