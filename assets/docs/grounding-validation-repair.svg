<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Grounding Validation and Repair</title><desc id="desc">Generated text is checked for grounded entities, numbers, relationships, polarity, provenance, skill evidence and overclaim behavior before acceptance.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03090e"/><stop offset="1" stop-color="#07131b"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif;fill:#edf5f8}.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.mut{fill:#8ea3b0}.g{fill:#69ff84}.c{fill:#63d8ff}.r{fill:#ff777e}.b{fill:#5aa7ff}.card{fill:#07121b;stroke:#244150;stroke-width:1.2}.line{stroke:#69ff84;stroke-width:3;fill:none}.h{font:bold 15px Inter,Arial}.s{font:11px Inter,Arial}.tag{font:bold 10px ui-monospace,monospace;letter-spacing:.7px}</style></defs><rect width="1200" height="675" rx="18" fill="url(#bg)"/><g opacity=".12" stroke="#3e738a"><path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M0 560H1200"/><path d="M80 0V675M160 0V675M240 0V675M320 0V675M400 0V675M480 0V675M560 0V675M640 0V675M720 0V675M800 0V675M880 0V675M960 0V675M1040 0V675M1120 0V675"/></g><text x="42" y="54" class="g m tag">SCOUT · VALIDATION</text><text x="42" y="104" class="t" font-size="40" font-weight="800">Grounding Validation &amp; Repair</text><text x="42" y="136" class="mut t" font-size="17">Generation is not accepted just because the model produced fluent text</text>
<g transform="translate(40 180)"><g><rect class="card" width="180" height="260" rx="10"/><circle cx="22" cy="22" r="12" class="g"/><text x="18" y="27" fill="#031009" font-weight="800">1</text><text x="44" y="28" class="t h">Draft answer</text><path d="M35 72h110v70H65l-24 20v-20h-6z" fill="#071c2a" stroke="#63d8ff" stroke-width="2"/><circle cx="66" cy="107" r="5" class="g"/><circle cx="89" cy="107" r="5" class="g"/><circle cx="112" cy="107" r="5" class="g"/><text x="18" y="194" class="mut s">Model-generated prose enters</text><text x="18" y="212" class="mut s">the validation stage before</text><text x="18" y="230" class="mut s">being returned.</text></g><path class="line" d="M190 130h42"/><g transform="translate(242)"><rect class="card" width="650" height="260" rx="10" stroke="#69ff84"/><circle cx="22" cy="22" r="12" class="g"/><text x="18" y="27" fill="#031009" font-weight="800">2</text><text x="44" y="28" class="t h">Grounding and claim checks</text><g transform="translate(18 65)"><rect class="card" width="96" height="145" rx="7"/><circle cx="48" cy="38" r="22" fill="#071c2a" stroke="#63d8ff"/><path d="M48 14v48M24 38h48" stroke="#69ff84"/><text x="18" y="82" class="t h">Entity</text><text x="11" y="103" class="mut s">Known people,</text><text x="11" y="119" class="mut s">projects, orgs.</text></g><g transform="translate(122 65)"><rect class="card" width="96" height="145" rx="7"/><text x="21" y="48" class="c" font-size="28" font-weight="800">123</text><text x="17" y="82" class="t h">Number</text><text x="10" y="103" class="mut s">Dates, counts,</text><text x="10" y="119" class="mut s">quantities.</text></g><g transform="translate(226 65)"><rect class="card" width="96" height="145" rx="7"/><circle cx="28" cy="39" r="7" fill="#63d8ff"/><circle cx="68" cy="24" r="7" fill="#63d8ff"/><circle cx="70" cy="59" r="7" fill="#69ff84"/><path d="M34 36l27-9M34 43l29 13" stroke="#63d8ff" stroke-width="2"/><text x="8" y="82" class="t h">Relation</text><text x="9" y="103" class="mut s">Who did what,</text><text x="9" y="119" class="mut s">where / when.</text></g><g transform="translate(330 65)"><rect class="card" width="96" height="145" rx="7"/><circle cx="48" cy="38" r="25" fill="#071c2a" stroke="#63d8ff"/><path d="M31 38h34" stroke="#69ff84" stroke-width="4"/><text x="8" y="82" class="t h">Polarity</text><text x="10" y="103" class="mut s">Negation and</text><text x="10" y="119" class="mut s">uncertainty.</text></g><g transform="translate(434 65)"><rect class="card" width="96" height="145" rx="7"/><path d="M48 14l27 12v22c0 18-12 28-27 36-15-8-27-18-27-36V26z" fill="#071c2a" stroke="#63d8ff"/><path d="M35 43h26M35 54h20" stroke="#69ff84"/><text x="7" y="82" class="t h">Provenance</text><text x="8" y="103" class="mut s">Claim/source</text><text x="8" y="119" class="mut s">association.</text></g><g transform="translate(538 65)"><rect class="card" width="96" height="145" rx="7"/><rect x="17" y="17" width="62" height="46" rx="5" fill="#071c2a" stroke="#63d8ff"/><text x="24" y="45" class="g m" font-size="16">vibe</text><text x="17" y="82" class="t h">Skill match</text><text x="8" y="103" class="mut s">Whole token /</text><text x="8" y="119" class="mut s">phrase evidence.</text></g><text x="20" y="239" class="mut s">Additional checks include technology/project provenance, claim ceilings, seniority/overclaim rules and contract-specific constraints.</text></g><path class="line" d="M902 130h36"/><g transform="translate(948)"><rect class="card" width="200" height="260" rx="10"/><circle cx="22" cy="22" r="12" class="g"/><text x="18" y="27" fill="#031009" font-weight="800">3</text><text x="44" y="28" class="t h">Outcome</text><rect x="20" y="63" width="160" height="50" rx="7" fill="#071c15" stroke="#69ff84"/><text x="38" y="94" class="g h">PASS · accept</text><rect x="20" y="125" width="160" height="50" rx="7" fill="#071627" stroke="#5aa7ff"/><text x="34" y="156" class="b h">REPAIR · retry</text><rect x="20" y="187" width="160" height="50" rx="7" fill="#1b0d12" stroke="#ff777e"/><text x="34" y="218" class="r h">REJECT · fail closed</text></g></g>
<g transform="translate(70 490)"><rect class="card" width="500" height="118" rx="10"/><text x="18" y="29" class="g h">Example: substring ≠ skill evidence</text><text x="18" y="57" class="t s">Question topic: <tspan class="c m">vibe</tspan></text><text x="18" y="77" class="t s">Evidence contains an unrelated word: <tspan class="c m">vibes</tspan></text><text x="18" y="99" class="mut s">Current develop uses whole-token/phrase matching so this does not verify “vibe”.</text></g><g transform="translate(630 490)"><rect class="card" width="500" height="118" rx="10"/><text x="18" y="29" class="g h">Example: absence of evidence ≠ evidence of absence</text><text x="18" y="57" class="t s">Supported: <tspan class="c">“No verified evidence documents employment there.”</tspan></text><text x="18" y="77" class="t s">Too strong without evidence: <tspan class="r">“He definitely never worked there.”</tspan></text><text x="18" y="99" class="mut s">Polarity, negation and open-world claim state are checked separately.</text></g><text x="600" y="646" text-anchor="middle" class="mut m" font-size="10">Visual summary. Exact checks and failure reasons are defined by the current validators and can change as develop is hardened.</text></svg>