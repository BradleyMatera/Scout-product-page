<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Scout request path system graphic</title>
  <desc id="desc">A technical system map showing browser input, query handling, retrieval, contracts and tools, model generation, validation, and output surrounding the Scout orchestration core.</desc>
  <defs>
    <linearGradient id="core" x1="390" y1="170" x2="810" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72EDB3" stop-opacity=".95"/>
      <stop offset="1" stop-color="#68A9FF" stop-opacity=".88"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#2A3645" stroke-opacity=".32" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="760" fill="#080C12"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <g fill="none" stroke="#395066" stroke-width="2" stroke-dasharray="7 10" opacity=".72">
    <path d="M174 190C310 160 388 214 472 316"/>
    <path d="M181 560C328 593 386 531 480 441"/>
    <path d="M1025 192C888 162 809 219 728 316"/>
    <path d="M1027 563C885 594 813 532 725 444"/>
    <path d="M600 87V252"/>
    <path d="M600 508V677"/>
  </g>
  <circle cx="600" cy="380" r="164" fill="#0C141D" stroke="#263848" stroke-width="2"/>
  <circle cx="600" cy="380" r="116" fill="#0A1017" stroke="url(#core)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="600" cy="380" r="66" fill="#0B1219" stroke="#5FDCA4" stroke-width="2"/>
  <text x="600" y="371" text-anchor="middle" fill="#EAF5F1" font-family="ui-monospace,monospace" font-size="22" font-weight="700">SCOUT</text>
  <text x="600" y="399" text-anchor="middle" fill="#7F93A5" font-family="ui-monospace,monospace" font-size="13">ORCHESTRATION</text>
  <g font-family="ui-monospace,monospace">
    <g transform="translate(80 130)"><rect width="190" height="106" rx="10" fill="#0E151D" stroke="#2E4051"/><circle cx="24" cy="24" r="5" fill="#78EAB2"/><text x="22" y="55" fill="#7D91A2" font-size="11">01 INPUT</text><text x="22" y="79" fill="#E9EFF3" font-size="17" font-weight="700">Browser widget</text></g>
    <g transform="translate(70 508)"><rect width="212" height="106" rx="10" fill="#0E151D" stroke="#315168"/><circle cx="24" cy="24" r="5" fill="#78EAB2"/><text x="22" y="55" fill="#7D91A2" font-size="11">03 EVIDENCE</text><text x="22" y="79" fill="#E9EFF3" font-size="17" font-weight="700">BM25 + RRF</text></g>
    <g transform="translate(494 30)"><rect width="212" height="106" rx="10" fill="#0E151D" stroke="#315168"/><circle cx="24" cy="24" r="5" fill="#78EAB2"/><text x="22" y="55" fill="#7D91A2" font-size="11">02 CONTROL</text><text x="22" y="79" fill="#E9EFF3" font-size="17" font-weight="700">Query understanding</text></g>
    <g transform="translate(918 130)"><rect width="202" height="106" rx="10" fill="#0D1620" stroke="#557BB0"/><circle cx="24" cy="24" r="5" fill="#72A8FF"/><text x="22" y="55" fill="#7D91A2" font-size="11">05 MODEL</text><text x="22" y="79" fill="#E9EFF3" font-size="17" font-weight="700">8B generation</text></g>
