<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Scout mark</title>
  <desc id="desc">A geometric S formed from connected system nodes.</desc>
  <defs>
    <linearGradient id="g" x1="18" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7EF0B8"/>
      <stop offset="1" stop-color="#65A9FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="7" y="7" width="114" height="114" rx="22" fill="#0A0F16" stroke="#253241" stroke-width="2"/>
  <path d="M91 35H50C38 35 30 42 30 52c0 9 7 14 18 16l31 6c12 2 19 8 19 18 0 11-9 19-22 19H35" fill="none" stroke="url(#g)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#0A0F16" stroke="url(#g)" stroke-width="4" filter="url(#glow)">
    <circle cx="91" cy="35" r="6"/>
    <circle cx="30" cy="52" r="6"/>
    <circle cx="98" cy="92" r="6"/>
    <circle cx="35" cy="111" r="6"/>
  </g>
</svg>