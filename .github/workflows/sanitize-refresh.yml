name: Sanitize Scout release snapshot

on:
  push:
    branches:
      - docs/scout-release-refresh-2026-09-15

permissions:
  contents: write

jobs:
  sanitize:
    if: contains(github.event.head_commit.message, '[sanitize-refresh]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Keep only public-safe runtime provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('source-state.json')
          state = json.loads(p.read_text())
          def safe(probe):
              if not isinstance(probe, dict):
                  return {'verified': False}
              if not probe.get('ok'):
                  return {'verified': False, 'status': probe.get('status')}
              d = probe.get('data') if isinstance(probe.get('data'), dict) else {}
              build = d.get('build') if isinstance(d.get('build'), dict) else {}
              env = d.get('buildEnv') if isinstance(d.get('buildEnv'), dict) else {}
              return {
                  'verified': True,
                  'httpStatus': probe.get('status'),
                  'status': d.get('status'),
                  'sourceRepository': build.get('sourceRepository') or env.get('sourceRepository'),
                  'sourceBranch': build.get('sourceBranch') or env.get('sourceBranch'),
                  'sourceCommit': build.get('sourceCommit') or env.get('sourceCommit'),
                  'provider': env.get('provider'),
                  'model': env.get('primaryModel') or env.get('cloudflareModel'),
                  'deadlineMs': env.get('deadlineMs'),
              }
          rh = state.get('runtimeHealth') if isinstance(state.get('runtimeHealth'), dict) else {}
          state['runtimeHealth'] = {
              'production': safe(rh.get('production')),
              'development': safe(rh.get('development')),
          }
          p.write_text(json.dumps(state, indent=2) + '\n')
          PY

      - name: Validate publication contracts
        run: |
          node scripts/prepare-site.js
          python3 scripts/verify-site.py
          node --check scene.js
          node --check site.js
          node --check docs.js
          node --check learn.js

      - name: Remove one-shot workflow and publish correction
        run: |
          rm .github/workflows/sanitize-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: keep runtime snapshot public-safe"
          git push origin HEAD:${GITHUB_REF_NAME}
