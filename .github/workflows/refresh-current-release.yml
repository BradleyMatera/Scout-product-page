name: Refresh current Scout product truth

on:
  push:
    branches:
      - docs/scout-release-refresh-2026-09-15

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[run-refresh]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make branch inventory resilient
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/refresh-scout-site.py')
          s = p.read_text()
          start = s.index('def all_branch_records(repo):')
          end = s.index('\n\ndef text(path):', start)
          replacement = '''def all_branch_records(repo):\n    rows = gh(f'/repos/{repo}/branches?per_page=100')\n    return sorted([\n        {'name': row['name'], 'sha': row['commit']['sha'], 'date': None, 'subject': None}\n        for row in rows\n    ], key=lambda x: x['name'].lower())\n'''
          p.write_text(s[:start] + replacement + s[end:])
          PY

      - name: Refresh current release content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/refresh-scout-site.py

      - name: Validate static site
        run: |
          node scripts/prepare-site.js
          python3 scripts/verify-site.py
          node --check scene.js
          node --check site.js
          node --check docs.js
          node --check learn.js
          node --check scripts/prepare-site.js

      - name: Commit refreshed product truth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No refresh changes produced"
            exit 1
          fi
          git commit -m "docs: refresh Scout product truth for September 15 release"
          git push origin HEAD:${GITHUB_REF_NAME}
